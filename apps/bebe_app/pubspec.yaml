name: bebe_app
description: DuckIT Labs BebéApp mobile application.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  app_base:
  core:
  design_system:
  injectable: any
  get_it: any
  intl: any
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  supabase_flutter: ^2.17.1
  notifications:

dev_dependencies:
  build_runner: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: any
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/launcher/
    - assets/branding/native_splash/
